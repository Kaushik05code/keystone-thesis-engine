[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "keystone-thesis-engine"
version = "2.0.0"
description = "Write your investment thesis in YAML. Score any company 0-100 against it."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kaushik G L"}]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
live = ["yfinance>=0.2.40"]
dev = ["pytest>=7"]

[project.scripts]
keystone = "keystone_thesis.cli:main"

[tool.setuptools.packages.find]
include = ["keystone_thesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
